name: build

# Baut bei jedem Push die Spiele-Builds (Raspberry Pi arm64 + macOS) und legt sie
# als Artifact ab. Bei einem Tag "v*" gibt es zusätzlich ein GitHub-Release.
# Vorbild: knusperpixel/office-racer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSLf -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          unzip -qj templates.tpz templates/linux_release.arm64 templates/macos.zip templates/version.txt -d "$dir"
          rm templates.tpz

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Unit tests
        run: ./godot --headless --path . -s tests/unit_test.gd

      - name: Two minute bot match (smoke test)
        run: ./godot --headless --path . --fixed-fps 60 -- --autotest=120 | tee match.log && grep -q "autotest after" match.log

      - name: Export
        run: |
          mkdir -p build/macos build/linux-arm64 dist
          ./godot --headless --path . --export-release "macOS" build/macos/B-Man.zip
          ./godot --headless --path . --export-release "Raspberry Pi (Linux arm64)" build/linux-arm64/b-man.arm64
          test -s build/macos/B-Man.zip && test -s build/linux-arm64/b-man.arm64
          cp build/macos/B-Man.zip dist/B-Man-macos.zip
          (cd build/linux-arm64 && chmod +x b-man.arm64 && zip -q ../../dist/B-Man-raspberrypi-arm64.zip b-man.arm64)

      - uses: actions/upload-artifact@v4
        with:
          name: B-Man
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
